name: MUSE_AUTH_REALITY_001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/muse_auth_reality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muse-auth-reality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "gate=MUSE_AUTH_REALITY_001"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "meta_api_key_present_before_unset=$([[ -n "${META_API_KEY:-}" ]] && echo YES || echo NO)"
            date -u +"started_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee evidence/run_identity.txt

      - name: Install Harbor 0.24.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install 'harbor==0.24.0' >/tmp/harbor_install.log 2>&1
          cp /tmp/harbor_install.log evidence/harbor_install.txt
          .venv/bin/harbor --version | tee evidence/harbor_version.txt

      - name: Attempt one Muse task with auth explicitly absent
        shell: bash
        run: |
          set +e
          unset META_API_KEY
          CMD=".venv/bin/harbor run --dataset terminal-bench@2.0 --agent muse-code --n-concurrent 1 --n-tasks 1 --ak max_model_steps=1"
          printf '%s\n' "$CMD" | tee evidence/exact_command.txt
          date -u +"run_started_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee evidence/run_timestamps.txt
          timeout 180s bash -lc "$CMD" > >(tee evidence/harbor_stdout.txt) 2> >(tee evidence/harbor_stderr.txt >&2)
          RC=$?
          date -u +"run_finished_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee -a evidence/run_timestamps.txt
          echo "$RC" | tee evidence/exit_code.txt
          find jobs -maxdepth 7 -type f -print 2>/dev/null | sort | tee evidence/job_files.txt || true
          exit 0

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set +e
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256SUMS.txt
          if [ -d jobs ]; then
            find jobs -type f -print0 | sort -z | xargs -0 sha256sum > evidence/JOBS_SHA256SUMS.txt
          else
            printf 'NO_JOBS_DIRECTORY\n' > evidence/JOBS_SHA256SUMS.txt
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MUSE_AUTH_REALITY_001_EVIDENCE
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/
            jobs/
