name: MONSTERBOY 4D HUNTER020 local checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run 85 local tests without API or GPU
        working-directory: monsterboy4d_hunter020
        run: >-
          python -m unittest -v
          test_MONSTERBOY4D_BLOCK2
          test_MONSTERBOY4D_BLOCK3
          test_MONSTERBOY4D_GATE002_REGRESSION
          tests.test_observatory.InventoryTests
          tests.test_observatory.CaptureTests
