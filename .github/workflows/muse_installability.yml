name: MUSE_INSTALLABILITY_001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/muse_installability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  muse-installability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "gate=MUSE_INSTALLABILITY_001"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            date -u +"started_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee evidence/run_identity.txt

      - name: Docker reality
        shell: bash
        run: |
          set -o pipefail
          { command -v docker; docker --version; docker version; } 2>&1 | tee evidence/docker_reality.txt

      - name: Install Harbor 0.24.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install 'harbor==0.24.0' 2>&1 | tee evidence/harbor_install.txt
          .venv/bin/harbor --version 2>&1 | tee evidence/harbor_version.txt
          .venv/bin/harbor agent schema muse-code 2>&1 | tee evidence/muse_agent_schema.txt || true

      - name: Muse Code install-only on one official TB2 task environment
        shell: bash
        run: |
          set +e
          CMD=".venv/bin/harbor run --dataset terminal-bench@2.0 --agent muse-code --n-concurrent 1 --n-tasks 1 --install-only"
          printf '%s\n' "$CMD" | tee evidence/exact_command.txt
          date -u +"run_started_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee evidence/run_timestamps.txt
          bash -lc "$CMD" > >(tee evidence/harbor_stdout.txt) 2> >(tee evidence/harbor_stderr.txt >&2)
          RC=$?
          date -u +"run_finished_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee -a evidence/run_timestamps.txt
          echo "$RC" | tee evidence/exit_code.txt
          find jobs -maxdepth 6 -type f -print 2>/dev/null | sort | tee evidence/job_files.txt || true
          exit "$RC"

      - name: Hash evidence
        if: always()
        shell: bash
        run: |
          set +e
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256SUMS.txt
          if [ -d jobs ]; then
            find jobs -type f -print0 | sort -z | xargs -0 sha256sum > evidence/JOBS_SHA256SUMS.txt
          else
            printf 'NO_JOBS_DIRECTORY\n' > evidence/JOBS_SHA256SUMS.txt
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MUSE_INSTALLABILITY_001_EVIDENCE
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/
            jobs/
