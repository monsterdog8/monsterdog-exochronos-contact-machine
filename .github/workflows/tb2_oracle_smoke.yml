name: TB2_ORACLE_SMOKE_001

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tb2_oracle_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "gate=TB2_ORACLE_SMOKE_001"
            echo "github_repository=$GITHUB_REPOSITORY"
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            date -u +"started_at_utc=%Y-%m-%dT%H:%M:%SZ"
          } | tee evidence/run_identity.txt

      - name: Reality gate - Docker
        shell: bash
        run: |
          set -o pipefail
          {
            command -v docker
            docker --version
            docker version
            docker info
          } 2>&1 | tee evidence/docker_reality.txt

      - name: Install Harbor 0.24.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip 2>&1 | tee evidence/pip_upgrade.txt
          .venv/bin/pip install 'harbor==0.24.0' 2>&1 | tee evidence/harbor_install.txt
          .venv/bin/harbor --version 2>&1 | tee evidence/harbor_version.txt
          .venv/bin/harbor run --help 2>&1 | tee evidence/harbor_run_help.txt

      - name: Resolve single-task limit flag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo 'limit_args=--n-tasks 1' >> "$GITHUB_OUTPUT"
          echo 'limit_flag=--n-tasks 1; observed in Harbor 0.24.0 help on workflow run 37798876897' | tee evidence/limit_resolution.txt

      - name: Dataset discovery
        shell: bash
        run: |
          set -o pipefail
          (.venv/bin/harbor dataset list || .venv/bin/harbor datasets list || true) 2>&1 | tee evidence/dataset_list.txt

      - name: Run Terminal-Bench 2.0 oracle - exactly one task
        id: run_tb2
        shell: bash
        run: |
          set +e
          LIMIT_ARGS='${{ steps.resolve.outputs.limit_args }}'
          CMD=".venv/bin/harbor run --dataset terminal-bench@2.0 --agent oracle --n-concurrent 1 ${LIMIT_ARGS}"
          printf '%s\n' "$CMD" | tee evidence/exact_command.txt
          date -u +"run_started_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee evidence/run_timestamps.txt
          bash -lc "$CMD" > >(tee evidence/harbor_stdout.txt) 2> >(tee evidence/harbor_stderr.txt >&2)
          RC=$?
          date -u +"run_finished_at_utc=%Y-%m-%dT%H:%M:%SZ" | tee -a evidence/run_timestamps.txt
          echo "$RC" | tee evidence/exit_code.txt
          find jobs -maxdepth 5 -type f -print 2>/dev/null | sort | tee evidence/job_files.txt || true
          exit "$RC"

      - name: Validate source binding and scientific PASS
        shell: bash
        env:
          EXPECTED_TB2_GIT_URL: https://github.com/laude-institute/terminal-bench-2.git
          EXPECTED_TB2_GIT_COMMIT: 69671fbaac6d67a7ef0dfec016cc38a64ef7a77c
          EXPECTED_TASK: gpt2-codegolf
          EXPECTED_REWARD: "1.0"
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee evidence/source_binding_verdict.json
          import json, os, pathlib, sys
          candidates = sorted(pathlib.Path("jobs").glob("*/*/result.json"))
          if len(candidates) != 1:
              print(json.dumps({"verdict":"FAIL_CLOSED","reason":"EXPECTED_EXACTLY_ONE_TRIAL_RESULT","count":len(candidates)}, sort_keys=True))
              raise SystemExit(31)
          p = candidates[0]
          data = json.loads(p.read_text())
          task_id = data.get("task_id") or {}
          verifier = data.get("verifier_result")
          rewards = (verifier or {}).get("rewards") or {}
          reward = rewards.get("reward")
          checks = {
              "git_url_match": task_id.get("git_url") == os.environ["EXPECTED_TB2_GIT_URL"],
              "git_commit_match": task_id.get("git_commit_id") == os.environ["EXPECTED_TB2_GIT_COMMIT"],
              "task_match": data.get("task_name") == os.environ["EXPECTED_TASK"],
              "exception_null": data.get("exception_info") is None,
              "verifier_present": verifier is not None,
              "reward_match": reward == float(os.environ["EXPECTED_REWARD"]),
          }
          verdict = "PASS" if all(checks.values()) else "FAIL_CLOSED"
          out = {
              "verdict": verdict,
              "result_path": str(p),
              "observed_git_url": task_id.get("git_url"),
              "observed_git_commit": task_id.get("git_commit_id"),
              "observed_task": data.get("task_name"),
              "observed_reward": reward,
              "checks": checks,
              "claim_ceiling": "OFFICIAL_HARBOR_ORACLE_SINGLE_TASK_SOURCE_BOUND_PASS" if verdict == "PASS" else "BLOCKED_SOURCE_OR_RESULT_MISMATCH",
          }
          print(json.dumps(out, sort_keys=True))
          if verdict != "PASS":
              raise SystemExit(32)
          PY

      - name: Hash evidence and job outputs
        if: always()
        shell: bash
        run: |
          set +e
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256SUMS.txt
          if [ -d jobs ]; then
            find jobs -type f -print0 | sort -z | xargs -0 sha256sum > evidence/JOBS_SHA256SUMS.txt
          else
            printf 'NO_JOBS_DIRECTORY\n' > evidence/JOBS_SHA256SUMS.txt
          fi
          date -u +"evidence_sealed_at_utc=%Y-%m-%dT%H:%M:%SZ" > evidence/sealed_at.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TB2_ORACLE_SMOKE_001_EVIDENCE
          if-no-files-found: error
          retention-days: 30
          path: |
            evidence/
            jobs/
